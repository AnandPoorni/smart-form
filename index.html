
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #4935a8;
            margin-bottom: 25px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        form {
            max-width: 450px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .gender {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .gender label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            margin: 0;
        }

        .gender input {
            width: auto;
        }

        button {
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn {
            width: 100%;
            background: #4935a8;
            color: white;
            margin-top: 10px;
        }

        .save-btn:hover {
            background: #30217f;
        }

        .table-section {
            margin-top: 35px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #4935a8;
            color: white;
        }

        tr:nth-child(even) {
            background: #f4f2ff;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            padding: 7px 12px;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: green;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            .container {
                padding: 18px;
            }

            th, td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <h1>SMART REGISTRATION FORM</h1>

    <div class="container">

        <h2>Student Form</h2>

        <form id="studentForm">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="studentName"
                    placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="studentAge"
                    placeholder="Enter your age" min="1" max="100" required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Course</label>

                <select id="studentCourse" required>
                    <option value="">Select Course</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Full Stack Development">Full Stack Development</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="studentEmail"
                    placeholder="Enter your email" required>
            </div>

            <button type="submit" class="save-btn">Register Student</button>

            <p id="message"></p>

        </form>

        <div class="table-section">

            <h2>Registered Student Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>AGE</th>
                        <th>GENDER</th>
                        <th>COURSE</th>
                        <th>EMAIL</th>
                        <th>ACTION</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                    <!-- Student details will appear here -->
                </tbody>
            </table>

        </div>

    </div>

    <script>

        // Get form and table elements

        var form = document.getElementById("studentForm");
        var studentList = document.getElementById("studentList");
        var message = document.getElementById("message");

        // Add student details

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Get input values

            var name = document.getElementById("studentName").value.trim();
            var age = document.getElementById("studentAge").value;
            var gender = document.querySelector('input[name="gender"]:checked').value;
            var course = document.getElementById("studentCourse").value;
            var email = document.getElementById("studentEmail").value.trim();

            // Create a new table row

            var row = document.createElement("tr");

            // Add student information

            var nameCell = document.createElement("td");
            nameCell.textContent = name;

            var ageCell = document.createElement("td");
            ageCell.textContent = age;

            var genderCell = document.createElement("td");
            genderCell.textContent = gender;

            var courseCell = document.createElement("td");
            courseCell.textContent = course;

            var emailCell = document.createElement("td");
            emailCell.textContent = email;

            // Create delete button

            var actionCell = document.createElement("td");

            var deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            // Delete selected student

            deleteButton.addEventListener("click", function() {

                row.remove();

                message.textContent = "Student record deleted successfully!";

            });

            // Add button to table

            actionCell.append(deleteButton);

            // Add all cells to row

            row.append(
                nameCell,
                ageCell,
                genderCell,
                courseCell,
                emailCell,
                actionCell
            );

            // Add row to table

            studentList.append(row);

            // Clear form

            form.reset();

            message.textContent = "Student registered successfully!";

        });

    </script>

</body>
</html>
